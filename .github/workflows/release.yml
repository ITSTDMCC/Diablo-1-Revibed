# Builds the Windows zip: the game, Play Diablo.bat, and devilutionx.mpq from the official
# DevilutionX 1.5.3 release (DevilutionX's own fonts and interface; no Blizzard game data).
# Pushes to main build the zip as a test artifact only; a v* tag publishes it as a release.
name: Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # no Visual C++ runtime needed on the player's PC
      RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "diablo1_rs-$env:GITHUB_REF_NAME-windows-x64" } else { "diablo1_rs-$($env:GITHUB_SHA.Substring(0,7))-windows-x64" }
          $dist = "dist/$name"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item target/release/diablo1_rs.exe "$dist/diablo1_rs.exe"
          Copy-Item packaging/windows/* $dist
          Copy-Item LICENSE-DevilutionX.md $dist
          # Guard: never ship game data or anything taken from it
          $bad = Get-ChildItem -Recurse $dist | Where-Object { $_.Extension -in '.mpq', '.sv', '.hsv', '.pcx', '.cel', '.cl2', '.clx', '.smk', '.wav', '.png', '.ini' }
          if ($bad) { $bad | ForEach-Object { Write-Error "game data in the package: $($_.Name)" }; exit 1 }
          # devilutionx.mpq from the official DevilutionX 1.5.3 release, checked by its hash
          Invoke-WebRequest -Uri https://github.com/diasurgical/DevilutionX/releases/download/1.5.3/devilutionx-windows-x86_64.zip -OutFile dvx.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dvx.zip))
          $e = $z.Entries | Where-Object { $_.Name -ieq 'devilutionx.mpq' } | Select-Object -First 1
          [System.IO.Compression.ZipFileExtensions]::ExtractToFile($e, (Join-Path (Resolve-Path $dist) 'devilutionx.mpq'), $true)
          $z.Dispose()
          $hash = (Get-FileHash "$dist/devilutionx.mpq" -Algorithm SHA256).Hash
          if ($hash -ne 'BED79D378D08B30FD1D3B4A48F609CAD887D3A00F6546AE24BA1A71FE4332052') { Write-Error "unexpected devilutionx.mpq ($hash)"; exit 1 }
          Compress-Archive -Path $dist -DestinationPath "dist/$name.zip"
          "ZIP=dist/$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "NAME=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.ZIP }}

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          name: diablo1_rs ${{ github.ref_name }}
          body: |
            Windows 10/11 (64-bit). **No game data included**: you need your own copy of Diablo (GOG: "Diablo + Hellfire").

            1. Download `${{ env.NAME }}.zip` below and unzip it anywhere (not inside Program Files).
            2. Copy `DIABDAT.MPQ` from your Diablo folder into the unzipped folder (and Hellfire's `hellfire.mpq`, `hfmonk.mpq`, `hfmusic.mpq`, `hfvoice.mpq` if you want Hellfire).
            3. Run **Play Diablo.bat**. F11 switches full screen on and off. Free movement (move in any direction; press X for the experimental first-person view) is Settings > Gameplay > Diablo 2 Free Movement.

            Only `DIABDAT.MPQ` is needed; Hellfire's files are optional (with all of them the game asks whether to play Diablo or Hellfire).

            The included `devilutionx.mpq` is DevilutionX's own fonts and interface pieces from the official DevilutionX 1.5.3 release, not Blizzard game data.

            Free, non-commercial use only (Sustainable Use License, see LICENSE-DevilutionX.md). Not affiliated with Blizzard Entertainment, GOG or the DevilutionX team.
